name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ["8.4", "8.5"]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci
          MYSQL_DATABASE: todo_test
          MYSQL_USER: todo_ci
          MYSQL_PASSWORD: todo_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, openssl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configure test database
        run: |
          cat > config/db.php <<'PHP'
          <?php
          return [
              'driver' => 'mysql',
              'host' => '127.0.0.1',
              'database' => 'todo_test',
              'username' => 'todo_ci',
              'password' => 'todo_ci_password',
              'charset' => 'utf8mb4',
              'collation' => 'utf8mb4_general_ci',
          ];
          PHP

      - name: Configure test application
        run: |
          cat > config/app.php <<'PHP'
          <?php
          return [
            'name'    => 'myApp',
            'host'    => 'http://localhost/',
            'hmacKey' => 'de69f2d41e7a5461cbeb8ab03546f93ed1078adb8d582c61c4c60aa1c672f29c',
            'appId'   => 'abcd1234'
          ];
          PHP

      - name: Initialize schema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y default-mysql-client

          MYSQL_PWD=todo_ci_password mysql \
            --protocol=tcp \
            -h 127.0.0.1 \
            -u todo_ci \
            todo_test < schema.sql

      - name: Run unit tests
        run: composer test:unit

      - name: Run integration tests
        run: composer test:integration
